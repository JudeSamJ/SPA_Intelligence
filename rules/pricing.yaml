# Price constants for the cost estimate in the engine bake-off. YOU fill these in from your own invoices/price list.
# Left null on purpose: until set, cost is shown as "n/a" and only real token / page counts are reported.
# Cost per document = tokens/1e6 * price (LLM) + pages/1000 * price (Document Intelligence). No other costs are modelled.
currency: USD
llm:
  input_per_million_tokens: null
  output_per_million_tokens: null
docint:
  layout_per_1000_pages: null
