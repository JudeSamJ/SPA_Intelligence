  - "\\bOqood\\b"
  - "\\bDubai\\b"

penalty:
  day_count_basis: 365            # days per year for pro-rata accrual of the CONTRACTUAL penalty
  # Compensation accrues only on days of delay AFTER the grace period has expired.
  scenarios_days: [30, 90, 180, 365]

